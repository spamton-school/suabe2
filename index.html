<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <link rel="icon" href="https://www.google.com/favicon.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #141414;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .loader-box {
            text-align: center;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #333;
            border-top-color: #00d9ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loading-text {
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: #aaa;
        }
        .error-msg {
            display: none;
            color: #ff5555;
            font-size: 14px;
            max-width: 320px;
            line-height: 1.5;
        }
        .retry-btn {
            display: none;
            padding: 8px 16px;
            background: #2a2a2a;
            color: #00d9ff;
            border: 1px solid #00d9ff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        .retry-btn:hover { background: #00d9ff; color: #141414; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader-box" id="loaderBox">
        <div class="spinner" id="spinner"></div>
        <div class="loading-text" id="statusText">Loading SUABE 2...</div>
        <div class="error-msg" id="errorMsg">Failed to load SUABE 2 and no offline cache found. Connect to internet and retry.</div>
        <button class="retry-btn" id="retryBtn">Retry</button>
    </div>
    <script>
        (function() {
            // Register Service Worker for offline PWA support
            if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
                navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function(err) {
                    console.warn('[SW] Registration failed:', err);
                });
            }

            var CACHE_KEY = 'suabe2_cached_build_dev';
            var DEV_BUILD_URL = 'dev/suabe2_dev.html';
            var CDN_URL = 'https://cdn.jsdelivr.net/gh/spamton-school/suabe2@main/dev/suabe2_dev.html';

            function prepare(html) {
                if (!html) return html;
                if (html.indexOf('/* suabe-scope */') !== -1) return html;
                var lastScriptClose = html.lastIndexOf('<\x2fscript>');
                if (lastScriptClose === -1) return html;
                var scriptOpenIdx = html.indexOf('<script>');
                if (scriptOpenIdx === -1) return html;
                var beforeScript = html.substring(0, scriptOpenIdx + 8);
                var scriptBody = html.substring(scriptOpenIdx + 8, lastScriptClose);
                var afterScript = html.substring(lastScriptClose);
                return beforeScript + '\n(function() { /* suabe-scope */\n' + scriptBody + '\n})();\n' + afterScript;
            }

            function launch(html) {
                var safeHtml = prepare(html);
                document.open('text/html', 'replace');
                document.write(safeHtml);
                document.close();
            }

            var cached = null;
            try {
                cached = localStorage.getItem(CACHE_KEY);
            } catch(e) {}

            if (cached && cached.indexOf('<!DOCTYPE html>') !== -1) {
                launch(cached);
                return;
            }

            var loaderBox = document.getElementById('loaderBox');
            var spinner = document.getElementById('spinner');
            var statusText = document.getElementById('statusText');
            var errorMsg = document.getElementById('errorMsg');
            var retryBtn = document.getElementById('retryBtn');
            if (loaderBox) loaderBox.style.display = 'flex';

            function fetchAndLaunch() {
                if (spinner) spinner.style.display = 'block';
                if (statusText) {
                    statusText.style.display = 'block';
                    statusText.textContent = 'Loading SUABE 2...';
                }
                if (errorMsg) errorMsg.style.display = 'none';
                if (retryBtn) retryBtn.style.display = 'none';

                // Try local dev build first (for same-origin GitHub Pages), then jsDelivr CDN
                fetch(DEV_BUILD_URL + '?_=' + Date.now(), { cache: 'no-cache' })
                    .catch(function() {
                        return fetch(CDN_URL + '?_=' + Date.now(), { cache: 'no-cache' });
                    })
                    .then(function(res) {
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.text();
                    })
                    .then(function(html) {
                        if (!html || html.indexOf('<!DOCTYPE html>') === -1) {
                            throw new Error('Invalid HTML received');
                        }
                        try {
                            localStorage.setItem(CACHE_KEY, html);
                            localStorage.setItem('suabe2_cached_build_dev_time', String(Date.now()));
                        } catch (e) {}
                        launch(html);
                    })
                    .catch(function(err) {
                        if (spinner) spinner.style.display = 'none';
                        if (statusText) statusText.style.display = 'none';
                        if (errorMsg) errorMsg.style.display = 'block';
                        if (retryBtn) retryBtn.style.display = 'inline-block';
                    });
            }

            if (retryBtn) retryBtn.addEventListener('click', fetchAndLaunch);
            fetchAndLaunch();
        })();
    </script>
</body>
</html>
