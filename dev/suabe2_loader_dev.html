<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <link rel="icon" href="https://www.google.com/favicon.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #141414;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .loader-box {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #333;
            border-top-color: #00d9ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loading-text {
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: #aaa;
        }
        .error-msg {
            display: none;
            color: #ff5555;
            font-size: 14px;
            max-width: 320px;
            line-height: 1.5;
        }
        .retry-btn {
            display: none;
            padding: 8px 16px;
            background: #2a2a2a;
            color: #00d9ff;
            border: 1px solid #00d9ff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        .retry-btn:hover { background: #00d9ff; color: #141414; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader-box">
        <div class="spinner" id="spinner"></div>
        <div class="loading-text" id="statusText">Loading SUABE 2...</div>
        <div class="error-msg" id="errorMsg">Failed to fetch SUABE 2 and no offline cache found. Connect to internet and retry.</div>
        <button class="retry-btn" id="retryBtn" onclick="loadSuabe()">Retry</button>
    </div>
    <script>
        const CACHE_KEY = 'suabe2_cached_build_dev';
        const CDN_URL = 'https://cdn.jsdelivr.net/gh/spamton-school/suabe2@main/dev/suabe2_dev.html';

        function launch(html) {
            document.open();
            document.write(html);
            document.close();
        }

        function loadSuabe() {
            const statusText = document.getElementById('statusText');
            const spinner = document.getElementById('spinner');
            const errorMsg = document.getElementById('errorMsg');
            const retryBtn = document.getElementById('retryBtn');

            // 1. Check local cache first
            try {
                const cached = localStorage.getItem(CACHE_KEY);
                if (cached && cached.includes('<!DOCTYPE html>')) {
                    launch(cached);
                    return;
                }
            } catch (e) {
                console.warn('Storage read error:', e);
            }

            // 2. Fetch from jsDelivr if not cached
            if (statusText) {
                statusText.style.display = 'block';
                statusText.textContent = 'Downloading SUABE 2...';
            }
            if (spinner) spinner.style.display = 'block';
            if (errorMsg) errorMsg.style.display = 'none';
            if (retryBtn) retryBtn.style.display = 'none';

            fetch(CDN_URL + '?_=' + Date.now(), { cache: 'no-cache' })
                .then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.text();
                })
                .then(html => {
                    if (!html || !html.includes('<!DOCTYPE html>')) {
                        throw new Error('Invalid HTML received');
                    }
                    try {
                        localStorage.setItem(CACHE_KEY, html);
                        localStorage.setItem('suabe2_cached_build_dev_time', String(Date.now()));
                    } catch (e) {
                        console.warn('Failed to cache build:', e);
                    }
                    launch(html);
                })
                .catch(err => {
                    console.error('Fetch error:', err);
                    if (spinner) spinner.style.display = 'none';
                    if (statusText) statusText.style.display = 'none';
                    if (errorMsg) errorMsg.style.display = 'block';
                    if (retryBtn) retryBtn.style.display = 'inline-block';
                });
        }

        loadSuabe();
    </script>
</body>
</html>
